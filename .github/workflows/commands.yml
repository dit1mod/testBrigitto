name: Bot Commands Polling

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # necessario per ricommittare il file di stato

jobs:
  check-commands:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run command handler
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot_commands.py

      - name: Commit updated state files (if changed)
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- last_update_id.txt subscribers.txt
          if ! git diff --staged --quiet; then
            git commit -m "aggiorna stato comandi e iscritti [skip ci]"
            for i in 1 2 3; do
              if git push; then
                echo "Push riuscito al tentativo $i"
                break
              fi
              echo "Push fallito, riprovo dopo aver riallineato con origin (tentativo $i)..."
              git pull --rebase origin main
              sleep 3
            done
          else
            echo "Nessuna modifica allo stato da salvare."
          fi
