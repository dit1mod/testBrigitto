name: Bot Commands Polling

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # Necessario per fare il push del file di stato

jobs:
  check-commands:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true # Accetta le credenziali per il push sicuro

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run command handler
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot_commands.py

      - name: Commit updated state file (if changed)
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          # Controlla se il file esiste prima di aggiungerlo per evitare errori
          if [ -f last_update_id.txt ]; then
            git add last_update_id.txt
            git diff --quiet && git diff --staged --quiet || (git commit -m "aggiorna stato comandi [skip ci]" && git push)
          fi
