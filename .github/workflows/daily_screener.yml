name: Daily Stock Screener

on:
  schedule:
    # 9:35 ET (apertura mercati USA + 5 min di margine).
    # ATTENZIONE: l'orario UTC cambia con l'ora legale/solare USA (DST):
    #   - Ora legale USA (EDT, marzo-inizio novembre): 9:35 ET = 13:35 UTC (valore attuale sotto)
    #   - Ora solare USA (EST, inizio novembre-marzo): 9:35 ET = 14:35 UTC
    # Va aggiornato manualmente 2 volte l'anno cambiando il valore "35 13" sotto.
    - cron: "35 13 * * 1-5"
  workflow_dispatch: {}   # permette anche l'avvio manuale dal sito GitHub

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run screener
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python stock_screener.py
